<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="workstation.css">
  <title>Kết nối máy chủ công nợ</title>
</head>
<body>
  <main>
    <h1>Kết nối máy chủ công nợ</h1>
    <form>
      <label for="server">Địa chỉ máy chủ</label>
      <input id="server" type="url" required autofocus spellcheck="false" maxlength="512" placeholder="http://192.168.1.20:3300" aria-describedby="hint">
      <p id="hint">Dùng địa chỉ máy chủ do quản trị viên cung cấp.</p>
      <p id="status" role="alert"></p>
      <button>Kết nối</button>
    </form>
  </main>
  <script src="workstation-form.js"></script>
</body>
</html>
