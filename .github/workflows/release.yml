name: Phát hành Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag phiên bản đã đẩy (ví dụ v0.1.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Lấy đúng mã nguồn của tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Kiểm tra tag trùng phiên bản và commit
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "v$version") {
            throw "Tag phải là v$version, trùng phiên bản ổn định trong package.json."
          }
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Tag chưa tồn tại trong repository.' }
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw 'Mã nguồn đang build không khớp tag.' }

      - name: Cài pnpm theo package.json
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Cài thư viện theo lockfile
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra chất lượng và nghiệp vụ
        run: pnpm check

      - name: Đóng gói bộ cài Windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm dist

      - name: Kiểm tra Electron cục bộ và máy trạm
        run: pnpm test:desktop

      - name: Kiểm tra bộ cài và metadata cập nhật
        run: pnpm test:release

      - name: Đăng đủ tệp rồi công bố GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) {
              throw 'Phiên bản này đã phát hành. Hãy tăng phiên bản và tạo tag mới.'
            }
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title $env:RELEASE_TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Không tạo được bản nháp GitHub Release.' }
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/Quan-Ly-Cong-No-Setup-$version.exe"
          gh release upload $env:RELEASE_TAG $installer "$installer.blockmap" release/latest.yml --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Không tải đủ tệp phát hành lên GitHub.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Không công bố được GitHub Release.' }
